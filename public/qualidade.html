<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Portal do analista: tratativas de qualidade, atendimentos, e-mails e prioridades. Acesso com login." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Grupo-E" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Portal do Analista | Grupo-E" />
  <meta property="og:description" content="Portal do analista: tratativas de qualidade, atendimentos, e-mails e prioridades. Acesso com login." />
  <meta name="twitter:card" content="summary" />
  <title>Portal do Analista | Grupo-E</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/cs-painel.css?v=26">
</head>
<body>

<!-- LOGIN (contas do Grupo-E) -->
<div id="login-screen">
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="login-logo"><div class="login-dot"></div><h2>Portal do Analista <span>/ Grupo-E</span></h2></div>
    <div class="login-title">Bem-vindo 👋</div>
    <div class="login-sub">Entre com o mesmo e-mail e senha do sistema Grupo-E.</div>
    <label class="login-label" for="inp-email">E-mail</label>
    <input class="login-input" type="email" id="inp-email" autocomplete="username" required>
    <label class="login-label" for="inp-senha">Senha</label>
    <input class="login-input" type="password" id="inp-senha" autocomplete="current-password" required>
    <button class="login-btn" type="submit" id="login-btn">Entrar</button>
    <div class="login-err" id="login-err" role="alert"></div>
  </form>
</div>

<!-- APLICATIVO -->
<div id="app">
 <div class="gp-layout">
  <aside class="gp-sidebar">
    <div class="gp-sidebar-logo">
      <img src="/img/logo-grupo-e.png" alt="Grupo-E">
      <div class="gp-sidebar-id">
        <span class="gp-sidebar-dot"></span>
        <div>
          <div class="gp-sidebar-title">Portal do Analista</div>
          <div class="gp-sidebar-sub" id="sub-analista">Tratativas, atendimentos e e-mails</div>
        </div>
      </div>
    </div>
    <nav class="gp-nav" id="nav">
      <button class="gp-nav-item active" data-sec="visao"><span class="gp-nav-icon">🏠</span>Visão Geral</button>
      <button class="gp-nav-item" data-sec="prioridades"><span class="gp-nav-icon">🚨</span>Prioridades<span class="gp-nav-badge" id="badge-prioridades"></span></button>
      <div class="gp-nav-divider">Qualidade</div>
      <button class="gp-nav-item" data-sec="tratativas"><span class="gp-nav-icon">✅</span>Tratativas<span class="gp-nav-badge" id="badge-tratativas"></span></button>
      <div class="gp-nav-divider">Meu trabalho</div>
      <button class="gp-nav-item" data-sec="nota"><span class="gp-nav-icon">🏆</span>Minha nota</button>
      <button class="gp-nav-item" data-sec="atendimentos"><span class="gp-nav-icon">🎧</span>Meus atendimentos</button>
      <button class="gp-nav-item" data-sec="emails"><span class="gp-nav-icon">📧</span>Meus e-mails</button>
      <div class="gp-nav-divider">Acompanhamento</div>
      <button class="gp-nav-item" data-sec="evolucao"><span class="gp-nav-icon">📈</span>Evolução semanal</button>
    </nav>
  </aside>

  <main class="gp-main">
    <div class="gp-header">
      <div>
        <div class="gp-header-title" id="titulo">Visão Geral</div>
        <div class="gp-header-sub" id="subtitulo"></div>
      </div>
      <div class="gp-header-right">
        <div class="filter-group" id="ver-como" style="display:none">
          <span class="filter-label">Ver como</span>
          <select class="gp-select" id="sel-analista"></select>
        </div>
        <div class="gp-live"><div class="gp-live-dot"></div> Ao vivo</div>
        <div class="gp-update" id="atualizado"></div>
        <button class="gp-footer-btn" style="width:auto;padding:4px 10px" id="btn-atualizar" title="Recarrega os dados">↻ Atualizar</button>
        <div id="menu-usuario"></div>
      </div>
    </div>

    <section class="gp-section ativa" id="sec-visao"></section>
    <section class="gp-section" id="sec-prioridades"></section>
    <section class="gp-section" id="sec-tratativas"></section>
    <section class="gp-section" id="sec-nota"></section>
    <section class="gp-section" id="sec-atendimentos"></section>
    <section class="gp-section" id="sec-emails"></section>
    <section class="gp-section" id="sec-evolucao"></section>
  </main>
 </div>
</div>

<script src="/js/menu-usuario.js?v=2"></script>
<script src="/js/qualidade.js?v=2"></script>
</body>
</html>
