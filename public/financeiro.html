<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Inadimplência, clientes suspensos e cobranças do Grupo-E. Acesso com login." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Grupo-E" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Financeiro | Grupo-E" />
  <meta property="og:description" content="Inadimplência, clientes suspensos e cobranças do Grupo-E. Acesso com login." />
  <meta property="og:url" content="https://grupo-e-sistema-uc2w.onrender.com/financeiro" />
  <meta name="twitter:card" content="summary" />
  <title>Financeiro | Grupo-E</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/cs-painel.css?v=17">
  <link rel="stylesheet" href="/css/financeiro.css?v=3">
</head>
<body>

<!-- LOGIN (as mesmas contas do Grupo-E) -->
<div id="login-screen">
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="login-logo"><div class="login-dot"></div><h2>Financeiro <span>/ Grupo-E</span></h2></div>
    <div class="login-title">Bem-vindo 👋</div>
    <div class="login-sub">Entre com o mesmo e-mail e senha do sistema Grupo-E.</div>
    <label class="login-label" for="inp-email">E-mail</label>
    <input class="login-input" type="email" id="inp-email" autocomplete="username" required>
    <label class="login-label" for="inp-senha">Senha</label>
    <input class="login-input" type="password" id="inp-senha" autocomplete="current-password" required>
    <button class="login-btn" type="submit" id="login-btn">Entrar</button>
    <div class="login-err" id="login-err" role="alert"></div>
  </form>
</div>

<!-- APLICATIVO -->
<div id="app">
 <div class="gp-layout">
  <aside class="gp-sidebar">
    <div class="gp-sidebar-logo">
      <img src="/img/logo-grupo-e.png" alt="Grupo-E">
      <div class="gp-sidebar-id">
        <span class="gp-sidebar-dot"></span>
        <div>
          <div class="gp-sidebar-title">Financeiro</div>
          <div class="gp-sidebar-sub">Inadimplência e cobranças</div>
        </div>
      </div>
    </div>
    <nav class="gp-nav" id="nav">
      <button class="gp-nav-item active" data-sec="visao"><span class="gp-nav-icon">🏠</span>Visão Geral</button>
      <button class="gp-nav-item" data-sec="oportunidades"><span class="gp-nav-icon">💡</span>Oportunidades<span class="gp-nav-badge" id="badge-op"></span></button>
      <div class="gp-nav-divider">Carteira</div>
      <button class="gp-nav-item" data-sec="inadimplentes"><span class="gp-nav-icon">⚠️</span>Inadimplentes<span class="gp-nav-badge" id="badge-inad"></span></button>
      <button class="gp-nav-item" data-sec="suspensos"><span class="gp-nav-icon">⏸</span>Suspensos<span class="gp-nav-badge gp-badge-ok" id="badge-susp"></span></button>
      <button class="gp-nav-item" data-sec="carteira"><span class="gp-nav-icon">📒</span>Todos os clientes</button>
      <div class="gp-nav-divider">Acompanhamento</div>
      <button class="gp-nav-item" data-sec="evolucao"><span class="gp-nav-icon">📈</span>Evolução</button>
      <button class="gp-nav-item" data-sec="cobrancas"><span class="gp-nav-icon">📣</span>Cobranças</button>
      <button class="gp-nav-item" data-sec="qualidade"><span class="gp-nav-icon">🔎</span>Qualidade dos Dados</button>
    </nav>
  </aside>

  <main class="gp-main">
    <div class="gp-header">
      <div>
        <div class="gp-header-title" id="titulo">Visão Geral</div>
        <div class="gp-header-sub" id="subtitulo"></div>
      </div>
      <div class="gp-header-right">
        <div class="gp-live"><div class="gp-live-dot"></div> Ao vivo</div>
        <div class="gp-update" id="atualizado"></div>
        <button class="gp-footer-btn" style="width:auto;padding:4px 10px;display:none" id="btn-valores" title="Esconde todos os valores em R$ da tela (para apresentações)">👁 Ocultar valores</button>
        <button class="gp-footer-btn" style="width:auto;padding:4px 10px" id="btn-csv" title="Baixa a lista da seção aberta (com o filtro atual) em CSV, para Excel">⬇ CSV</button>
        <button class="gp-footer-btn" style="width:auto;padding:4px 10px;display:none" id="btn-csv-tit" title="Baixa um CSV com uma linha por honorário em aberto, das empresas desta lista">⬇ CSV por título</button>
        <button class="gp-footer-btn" style="width:auto;padding:4px 10px" id="btn-pdf" title="Baixa a lista da seção aberta (com o filtro atual) em PDF">⬇ PDF</button>
        <button class="gp-footer-btn" style="width:auto;padding:4px 10px" id="btn-atualizar" title="Recarrega os dados">↻ Atualizar</button>
        <div id="menu-usuario"></div>
      </div>
    </div>

    <section class="gp-section ativa" id="sec-visao"></section>
    <section class="gp-section" id="sec-oportunidades"></section>
    <section class="gp-section" id="sec-inadimplentes"></section>
    <section class="gp-section" id="sec-suspensos"></section>
    <section class="gp-section" id="sec-carteira"></section>
    <section class="gp-section" id="sec-evolucao"></section>
    <section class="gp-section" id="sec-cobrancas"></section>
    <section class="gp-section" id="sec-qualidade"></section>
  </main>
 </div>
</div>

<!-- FICHA DO CLIENTE (abre ao clicar no nome da empresa) -->
<div id="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-nome">
  <div class="ficha-box fin">
    <div class="ficha-topo">
      <div style="min-width:0">
        <div class="ficha-nome" id="ficha-nome"></div>
        <div class="ficha-sub" id="ficha-sub"></div>
        <div class="ficha-passo" id="ficha-passo"></div>
      </div>
      <button class="ficha-x" id="ficha-fechar" aria-label="Fechar">✕</button>
    </div>
    <div id="ficha-corpo"></div>
  </div>
</div>

<script src="/js/exportar.js?v=1"></script>
<script src="/js/menu-usuario.js?v=2"></script>
<script src="/js/financeiro.js?v=7"></script>
</body>
</html>
