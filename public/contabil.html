<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Contábil — Grupo-E</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --green:#1a4233;--green-light:#2a6e4a;--green-pale:#e8f4ef;
      --gold:#f5c518;--gray-50:#f8fafc;--gray-100:#f1f5f9;
      --gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-500:#64748b;
      --gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;
      --white:#fff;--radius:12px;--shadow:0 4px 16px rgba(0,0,0,.08);
    }
    body{font-family:'Inter',sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh}
    /* LOGIN */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .login-card{background:var(--white);border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.12);padding:40px;width:100%;max-width:400px}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo img{height:60px;object-fit:contain}
    .login-title{font-size:18px;font-weight:800;color:var(--green);text-align:center;margin-bottom:6px}
    .login-sub{font-size:13px;color:var(--gray-400);text-align:center;margin-bottom:24px}
    .field label{display:block;font-size:12px;font-weight:700;color:var(--gray-500);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    .field input{width:100%;padding:10px 14px;border:1px solid var(--gray-200);border-radius:8px;font-size:14px;outline:none;transition:border .15s}
    .field input:focus{border-color:var(--green)}
    .field{margin-bottom:14px}
    .btn-login{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
    .btn-login:hover{background:var(--green-light)}
    .login-err{color:#e53e3e;font-size:13px;text-align:center;margin-top:10px;display:none}
    /* APP */
    #app-screen{display:none}
    .topbar{background:var(--green);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
    .topbar-logo{height:36px;object-fit:contain}
    .topbar-user{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);font-size:13px}
    .btn-sair{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
    .main{max-width:900px;margin:0 auto;padding:24px 16px}
    .page-title{font-size:20px;font-weight:800;color:var(--green);margin-bottom:6px}
    .page-sub{font-size:13px;color:var(--gray-400);margin-bottom:20px}
    /* FILTROS */
    .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .btn-filtro{padding:6px 16px;border-radius:20px;border:1px solid var(--gray-200);background:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
    .btn-filtro.ativo{background:var(--green);color:#fff;border-color:var(--green)}
    /* TICKET CARD */
    .ticket-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s}
    .ticket-card:hover{box-shadow:var(--shadow)}
    .tk-empresa{font-size:15px;font-weight:800;color:var(--gray-800)}
    .tk-badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .tk-meta{font-size:12px;color:var(--gray-400);margin-top:4px}
    .tk-progress-bar{background:var(--gray-100);border-radius:6px;height:5px;width:100%;margin-top:8px;overflow:hidden}
    .tk-progress-fill{background:var(--green);height:100%;transition:width .3s}
    /* MODAL OVERLAY */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 64px rgba(0,0,0,.2)}
    .modal-header{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center}
    .modal-header h2{font-size:16px;font-weight:800;color:var(--green)}
    .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray-400)}
    .modal-body{padding:16px 24px 24px}
    .checklist-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:6px}
    .checklist-item input[type=checkbox]{width:16px;height:16px;cursor:pointer}
    .interacao-box{background:#f8fafc;border:1px solid var(--gray-200);border-radius:8px;padding:10px 14px;margin-bottom:8px}
    .interacao-auto{background:#f0fdf4;border-color:#bbf7d0}
    textarea{width:100%;min-height:70px;padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;resize:vertical;font-family:'Inter',sans-serif}
    textarea:focus{outline:none;border-color:var(--green)}
    .btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
    .btn-primary{background:var(--green);color:#fff}
    .btn-primary:hover{background:var(--green-light)}
    .btn-ghost{background:var(--gray-100);color:var(--gray-600)}
    .empty{text-align:center;color:var(--gray-400);padding:60px 20px;font-size:14px}
  </style>
</head>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div style="width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-style:italic;font-size:18px">e</div>
    <div class="topbar-user">
      <span id="app-nome"></span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="page-title">🎫 Meus Tickets</div>
    <div class="page-sub">Tickets contábeis onde você foi mencionado</div>

    <div class="filtros">
      <button class="btn-filtro ativo" id="f-todos"     onclick="filtrar('todos')">Todos</button>
      <button class="btn-filtro"       id="f-nova"      onclick="filtrar('nova')">🔴 Nova</button>
      <button class="btn-filtro"       id="f-resolvendo"onclick="filtrar('resolvendo')">🟡 Resolvendo</button>
      <button class="btn-filtro"       id="f-encerrada" onclick="filtrar('encerrada')">🟢 Encerrada</button>
    </div>

    <div id="lista-tickets"><div class="empty">Carregando...</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="fecharModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-titulo"></h2>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body" id="modal-conteudo"></div>
  </div>
</div>

<script>
let _token = null;
let _user  = null;
let _todos = [];
let _filtro = 'todos';
let _ticketAberto = null;

const STATUS_LABEL = { nova:'🔴 Nova', resolvendo:'🟡 Resolvendo', encerrada:'🟢 Encerrada' };
const STATUS_BG    = { nova:'#fee2e2', resolvendo:'#fef9c3', encerrada:'#dcfce7' };
const STATUS_COLOR = { nova:'#991b1b', resolvendo:'#854d0e', encerrada:'#166534' };

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function login() {
  const email = document.getElementById('l-email').value.trim();
  const senha  = document.getElementById('l-senha').value;
  const err    = document.getElementById('l-err');
  err.style.display = 'none';
  if (!email || !senha) { err.textContent = 'Preencha e-mail e senha.'; err.style.display = 'block'; return; }
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: senha })
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Credenciais inválidas.'; err.style.display = 'block'; return; }
  if (!['contabil','administrador'].includes(data.user.role)) {
    err.textContent = 'Acesso restrito ao portal contábil.'; err.style.display = 'block'; return;
  }
  _token = data.token;
  _user  = data.user;
  localStorage.setItem('ctb_token', _token);
  localStorage.setItem('ctb_user', JSON.stringify(_user));
  mostrarApp();
}

function sair() {
  _token = null; _user = null;
  localStorage.removeItem('ctb_token');
  localStorage.removeItem('ctb_user');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display   = 'none';
}

function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display   = 'block';
  document.getElementById('app-nome').textContent = _user.name;
  carregarTickets();
}

function api(path, opts) {
  return fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + _token, ...(opts?.headers||{}) } });
}

// ── AUTO LOGIN ────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const t = localStorage.getItem('ctb_token');
  const u = localStorage.getItem('ctb_user');
  if (t && u) { _token = t; _user = JSON.parse(u); mostrarApp(); }
});

// ── TICKETS ───────────────────────────────────────────────────────────────────
async function carregarTickets() {
  const lista = document.getElementById('lista-tickets');
  lista.innerHTML = '<div class="empty">Carregando...</div>';
  const res = await api('/api/data/tickets');
  if (!res.ok) { lista.innerHTML = '<div class="empty">Erro ao carregar tickets.</div>'; return; }
  const { data } = await res.json();
  _todos = data || [];
  renderLista();
}

function filtrar(f) {
  _filtro = f;
  ['todos','nova','resolvendo','encerrada'].forEach(k => {
    const btn = document.getElementById('f-' + k);
    if (btn) btn.className = 'btn-filtro' + (k === f ? ' ativo' : '');
  });
  renderLista();
}

function renderLista() {
  const lista = document.getElementById('lista-tickets');
  const dados = _filtro === 'todos' ? _todos : _todos.filter(t => t.status === _filtro);
  if (!dados.length) { lista.innerHTML = '<div class="empty">Nenhum ticket encontrado.</div>'; return; }
  lista.innerHTML = dados.map(t => {
    const dias  = parseInt(t.dias) || 0;
    const total = t.checklist?.length || 0;
    const feitos = t.checklist?.filter(c => c.ok).length || 0;
    const pct   = total ? Math.round(feitos/total*100) : 0;
    return '<div class="ticket-card" onclick="abrirTicket(\'' + t.id + '\')">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">' +
        '<span class="tk-empresa">' + t.empresa + '</span>' +
        '<span class="tk-badge" style="background:' + STATUS_BG[t.status] + ';color:' + STATUS_COLOR[t.status] + '">' + STATUS_LABEL[t.status] + '</span>' +
        '<span style="font-size:11px;color:var(--gray-400)">⏱ ' + dias + ' dia' + (dias!==1?'s':'') + '</span>' +
      '</div>' +
      '<div class="tk-meta">' + t.cnpj + ' · ' + t.regime + ' · ' + t.tipo_movimentacao + '</div>' +
      '<div class="tk-meta" style="margin-top:2px">Checklist: ' + feitos + '/' + total + ' itens</div>' +
      '<div class="tk-progress-bar"><div class="tk-progress-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');
}

// ── MODAL TICKET ──────────────────────────────────────────────────────────────
async function abrirTicket(id) {
  _ticketAberto = id;
  const res = await api('/api/data/tickets/' + id);
  if (!res.ok) return;
  const { data: t } = await res.json();
  document.getElementById('modal-titulo').textContent = t.empresa;

  const dias = parseInt(t.dias) || 0;
  const isAdmin = _user.role === 'administrador';

  // Checklist
  const checklistHtml = (t.checklist||[]).map((c, i) => {
    const bg  = c.ok ? '#dcfce7' : '#f8fafc';
    const cor = c.ok ? '#166534' : 'var(--gray-700)';
    const info = c.ok ? ' — ' + c.por + ' em ' + new Date(c.em).toLocaleString('pt-BR') : '';
    return '<div class="checklist-item" style="background:' + bg + '">' +
      '<input type="checkbox" ' + (c.ok?'checked':'') + ' data-idx="' + i + '" onchange="marcarItem(' + i + ',this)">' +
      '<span style="font-weight:600;color:' + cor + '">' + (c.ok?'✅ ':'') + c.item + (c.ok?' OK':'') + '</span>' +
      '<span style="font-size:11px;color:var(--gray-400);margin-left:4px">' + info + '</span>' +
    '</div>';
  }).join('') || '<div style="color:var(--gray-400);font-size:13px">Sem itens no checklist.</div>';

  // Interações
  const intHtml = (t.interacoes||[]).map(i =>
    '<div class="interacao-box' + (i.is_automatica?' interacao-auto':'') + '">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:4px">' +
        '<span style="font-size:12px;font-weight:700;color:var(--green)">' + (i.is_automatica?'🤖 Sistema':i.autor_nome) + '</span>' +
        '<span style="font-size:11px;color:var(--gray-400)">' + new Date(i.created_at).toLocaleString('pt-BR') + '</span>' +
      '</div>' +
      '<div style="font-size:13px;color:var(--gray-700)">' + i.comentario + '</div>' +
    '</div>'
  ).join('') || '<div style="color:var(--gray-400);font-size:13px;padding:8px">Nenhuma interação ainda.</div>';

  const statusBtns = isAdmin && t.status !== 'encerrada'
    ? '<button class="btn btn-primary" onclick="encerrarTicket(\'' + id + '\')" style="background:#166534">✅ Encerrar</button>'
    : isAdmin && t.status === 'encerrada'
    ? '<button class="btn btn-ghost" onclick="reabrirTicket(\'' + id + '\')">🔄 Reabrir</button>'
    : '';

  document.getElementById('modal-conteudo').innerHTML =
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">' +
      '<span style="background:' + STATUS_BG[t.status] + ';color:' + STATUS_COLOR[t.status] + ';padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700">' + STATUS_LABEL[t.status] + '</span>' +
      '<span style="font-size:12px;color:var(--gray-500)">⏱ ' + dias + ' dia(s)</span>' +
      '<span style="font-size:12px;color:var(--gray-500)">' + t.cnpj + ' · ' + t.regime + '</span>' +
    '</div>' +
    (t.observacoes ? '<div style="background:#f8fafc;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px"><strong>Observações:</strong> ' + t.observacoes + '</div>' : '') +
    '<div style="font-size:13px;font-weight:700;margin-bottom:8px">📋 Checklist</div>' +
    checklistHtml +
    '<div style="font-size:13px;font-weight:700;margin:14px 0 8px">💬 Interações</div>' +
    intHtml +
    '<div style="font-size:13px;font-weight:700;margin:14px 0 6px">Adicionar comentário</div>' +
    '<textarea id="ctb-comentario" placeholder="Digite seu comentário..."></textarea>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">' +
      (statusBtns || '<div></div>') +
      '<button class="btn btn-primary" onclick="enviarComentario()">Enviar</button>' +
    '</div>';

  document.getElementById('modal-overlay').style.display = 'flex';
}

async function marcarItem(idx, checkbox) {
  const res = await api('/api/data/tickets/' + _ticketAberto + '/checklist', {
    method: 'PATCH',
    body: JSON.stringify({ item_index: idx })
  });
  if (res.ok) {
    const { todosOk } = await res.json();
    if (todosOk) alert('✅ Checklist completo! Documentos direcionados para cs@escritorial.com.br');
    await abrirTicket(_ticketAberto);
    carregarTickets();
  } else {
    checkbox.checked = !checkbox.checked;
    alert('Erro ao marcar item. Verifique sua permissão.');
  }
}

async function enviarComentario() {
  const comentario = document.getElementById('ctb-comentario')?.value?.trim();
  if (!comentario) { alert('Digite um comentário.'); return; }
  const res = await api('/api/data/tickets/' + _ticketAberto + '/interacoes', {
    method: 'POST',
    body: JSON.stringify({ comentario })
  });
  if (res.ok) {
    await abrirTicket(_ticketAberto);
    carregarTickets();
  } else alert('Erro ao enviar comentário.');
}

async function encerrarTicket(id) {
  if (!confirm('Encerrar este ticket?')) return;
  const res = await api('/api/data/tickets/' + id + '/status', {
    method: 'PATCH', body: JSON.stringify({ status: 'encerrada' })
  });
  if (res.ok) { fecharModal(); carregarTickets(); }
}

async function reabrirTicket(id) {
  const res = await api('/api/data/tickets/' + id + '/status', {
    method: 'PATCH', body: JSON.stringify({ status: 'resolvendo' })
  });
  if (res.ok) { fecharModal(); carregarTickets(); }
}

function fecharModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').style.display = 'none';
    _ticketAberto = null;
  }
}
</script>
