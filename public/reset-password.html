<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha — Grupo-E</title>
  <style>
    :root{ --green:#14532d; --gray:#64748b; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#14532d,#0f3d22);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:400px;padding:32px}
    .logo{text-align:center;margin-bottom:8px;font-weight:800;color:var(--green);font-size:22px}
    h1{font-size:18px;color:var(--green);text-align:center;margin:8px 0 4px}
    .sub{color:var(--gray);text-align:center;font-size:13px;margin-bottom:24px}
    label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:4px;margin-top:14px}
    input{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
    button{width:100%;margin-top:20px;background:var(--green);color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:16px;padding:12px;border-radius:8px;font-size:14px;text-align:center;display:none}
    .msg.ok{background:#dcfce7;color:#166534;display:block}
    .msg.err{background:#fef2f2;color:#dc2626;display:block}
    .voltar{display:block;text-align:center;margin-top:18px;color:var(--green);font-size:13px;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GRUPO-E</div>
    <h1>Redefinir senha</h1>
    <div class="sub">Crie uma nova senha para sua conta</div>

    <div id="form-area">
      <label for="senha">Nova senha</label>
      <input id="senha" type="password" placeholder="Mínimo 6 caracteres" />
      <label for="senha2">Confirme a nova senha</label>
      <input id="senha2" type="password" placeholder="Repita a senha" />
      <button id="btn" onclick="redefinir()">Redefinir senha</button>
    </div>

    <div class="msg" id="msg"></div>
    <a class="voltar" href="/">← Voltar para o login</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const msg = document.getElementById('msg');
    const formArea = document.getElementById('form-area');

    function mostrar(texto, tipo) {
      msg.textContent = texto;
      msg.className = 'msg ' + tipo;
    }

    // Verifica se o token é válido ao abrir a página
    (async () => {
      if (!token) { formArea.style.display = 'none'; mostrar('Link inválido. Solicite uma nova recuperação de senha.', 'err'); return; }
      try {
        const res = await fetch('/api/auth/reset-valido?token=' + encodeURIComponent(token));
        const data = await res.json();
        if (!data.valido) { formArea.style.display = 'none'; mostrar('Este link expirou ou já foi usado. Solicite um novo na tela de login.', 'err'); }
      } catch (e) { /* deixa tentar mesmo assim */ }
    })();

    async function redefinir() {
      const senha = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;
      if (!senha || senha.length < 6) { mostrar('A senha deve ter ao menos 6 caracteres.', 'err'); return; }
      if (senha !== senha2) { mostrar('As senhas não coincidem.', 'err'); return; }
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Salvando...';
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, senha })
        });
        const data = await res.json();
        if (res.ok) {
          formArea.style.display = 'none';
          mostrar(data.message || 'Senha redefinida com sucesso!', 'ok');
        } else {
          mostrar(data.error || 'Erro ao redefinir a senha.', 'err');
          btn.disabled = false; btn.textContent = 'Redefinir senha';
        }
      } catch (e) {
        mostrar('Erro de conexão. Tente novamente.', 'err');
        btn.disabled = false; btn.textContent = 'Redefinir senha';
      }
    }
  </script>
</body>
</html>
